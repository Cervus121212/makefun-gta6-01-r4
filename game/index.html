<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Porto Vela — open-world crime in the spirit of GTA 6</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #11141b; font-family: Arial, Helvetica, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  #hud-tl { position: absolute; top: 12px; left: 14px; text-shadow: 0 1px 3px #000; }
  #cash-line { font-size: 26px; font-weight: bold; }
  #cash-line #rep-line { font-size: 13px; color: #ffd24a; margin-left: 10px; }
  #stars-line { font-size: 22px; letter-spacing: 2px; }
  #stars-line span { color: #555; }
  #stars-line span.on { color: #ffd24a; }
  #bars { margin-top: 4px; }
  #hp-bar, #arm-bar { width: 170px; height: 9px; background: rgba(0,0,0,.55); border: 1px solid #000; margin-top: 3px; }
  #hp-bar i { display: block; height: 100%; background: #3fae5a; width: 100%; }
  #arm-bar i { display: block; height: 100%; background: #4a8ad8; width: 100%; }
  #clock-line { font-size: 15px; margin-top: 5px; font-weight: bold; }
  #radio-line { font-size: 12px; color: #ffd98a; margin-top: 2px; }
  #hud-mission { position: absolute; top: 12px; right: 218px; width: 300px; background: rgba(10,12,18,.72); border: 1px solid #8a6a2a; padding: 8px 10px; }
  #m-chapter { font-size: 12px; color: #ffd24a; font-weight: bold; }
  #m-title { font-size: 16px; font-weight: bold; margin: 2px 0; }
  #m-timer { font-size: 13px; color: #ff9a5a; }
  #m-stage { height: 6px; background: #333; margin: 5px 0; }
  #m-stage i { display: block; height: 100%; background: #ffd24a; width: 0; }
  #m-next, #m-obj { font-size: 12px; color: #d8d8d8; }
  #hud-police { position: absolute; top: 190px; right: 218px; width: 300px; background: rgba(10,12,18,.72); border: 1px solid #5a2a2a; padding: 8px 10px; display: none; font-size: 12px; }
  #hud-police .p-head { color: #ff7a6a; font-weight: bold; margin-bottom: 4px; }
  #hud-police i { color: #ffd24a; }
  #hud-vehicle { position: absolute; right: 218px; bottom: 16px; text-align: right; text-shadow: 0 1px 3px #000; display: none; }
  #v-name { font-size: 17px; font-weight: bold; }
  #v-cond { font-size: 12px; color: #d8d8d8; }
  #v-speed { font-size: 34px; font-weight: bold; }
  #hud-weapons { position: absolute; left: 14px; bottom: 16px; font-size: 13px; }
  #hud-weapons span { background: rgba(10,12,18,.7); border: 1px solid #555; padding: 4px 8px; margin-right: 6px; }
  #hud-weapons span.sel { border-color: #ffd24a; color: #ffd24a; }
  #hud-weapons span.locked { color: #777; }
  #msg { position: absolute; top: 12%; left: 50%; transform: translateX(-50%); font-size: 14px; background: rgba(10,12,18,.85); border: 1px solid #ffd24a; padding: 7px 16px; border-radius: 20px; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  #msg.show { opacity: 1; }
  #dialogue { position: absolute; left: 14px; bottom: 64px; display: none; align-items: center; background: rgba(10,12,18,.8); border: 1px solid #555; padding: 8px 12px; max-width: 460px; }
  #dialogue.show { display: flex; }
  #dialogue.shot-mission { left: 14px; bottom: 64px; }
  #dlg-face { width: 44px; height: 44px; border-radius: 50%; background: #7a2a4a; color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center; margin-right: 10px; flex: none; }
  #dlg-name { font-size: 12px; color: #ffd24a; font-weight: bold; }
  #dlg-text { font-size: 13px; }
  #minimap-wrap { position: absolute; top: 12px; right: 14px; }
  #minimap { width: 190px; height: 190px; border: 2px solid rgba(255,255,255,.7); border-radius: 50%; display: block; background: #4d555e; }
  #map-label { text-align: center; font-size: 11px; margin-top: 4px; text-shadow: 0 1px 3px #000; }
  #damage-flash { position: absolute; inset: 0; background: #d81a1a; opacity: 0; transition: opacity .18s; pointer-events: none; }
  #test-results { position: absolute; left: -9999px; top: 0; }
  #title-screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(20,10,30,.25), rgba(20,10,30,.65)); }
  #title-screen.show { display: flex; }
  #title-screen h1 { font-size: 64px; letter-spacing: 6px; color: #ffd24a; margin: 0; text-shadow: 0 3px 12px #000; }
  #title-screen p { font-size: 16px; color: #fff; text-shadow: 0 1px 4px #000; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Porto Vela: drive, fight and finish eight story missions across the bay"></canvas>
<div id="hud"></div>
<div id="title-screen"><h1>PORTO VELA</h1><p>Eight missions. One bay. No mercy. — press Enter to play</p><p>WASD drive · E interact · Click shoot · R radio · 1/2 weapons</p></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/boot.js"></script>
</body>
</html>
